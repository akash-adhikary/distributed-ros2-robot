slam_toolbox:
  ros__parameters:
    use_sim_time: false
    autostart: true
    use_lifecycle_manager: false

    # Solver Plugins
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    # Frames & Topics
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # Map Update & Scan Matching Performance
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 0.3
    resolution: 0.05
    min_laser_range: 0.10
    max_laser_range: 16.0
    minimum_time_interval: 0.05
    transform_timeout: 0.25
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Continuous Encoderless Scan-Matching
    use_scan_matching: true
    use_scan_barycenter: false
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 16.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 2.0

    # 2D Correlation Search Space (Expanded for Walking Speeds)
    correlation_search_space_dimension: 0.80
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.10

    # Multi-Room Loop Closure Parameters
    do_loop_closing: true 
    loop_search_maximum_distance: 12.0
    loop_match_minimum_chain_size: 6
    loop_match_maximum_variance_coarse: 4.0
    loop_match_minimum_response_coarse: 0.28
    loop_match_minimum_response_fine: 0.38
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Penalties (Balances Lidar geometry with smooth Heading)
    distance_variance_penalty: 0.40
    angle_variance_penalty: 0.80
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.85
    minimum_distance_penalty: 0.40
    use_response_expansion: false
