ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    
    imu0: /imu_reliable
    imu0_config: [false, false, false, # x, y, z
                  false, false, true,  # roll, pitch, yaw (yaw locked)
                  false, false, false, # vx, vy, vz
                  false, false, true,  # vroll, vpitch, vyaw (vyaw locked)
                  false, false, false] # ax, ay, az
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 15
    imu0_remove_gravitational_acceleration: true
    
